# Run the whole app locally: docker compose up --build
#   frontend → http://localhost:8080
#   API      → http://localhost:8000/health
#   Postgres → only reachable by the API (no host port)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: heirloom
      POSTGRES_USER: heirloom
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-local-only-password} # local only; Azure uses its own secret
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heirloom -d heirloom"]
      interval: 3s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://heirloom:${LOCAL_DB_PASSWORD:-local-only-password}@db:5432/heirloom
      CORS_ORIGIN: http://localhost:8080
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  dbdata:
