# API pipeline: test against a real Postgres → build the image → push to Docker Hub → roll out to Container Apps.
# Pull requests run the tests and the build only; nothing is published or deployed.

name: api

on:
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["api/**", ".github/workflows/api.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC: azure/login gets a short-lived token, no Azure password stored in GitHub

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME || 'local' }}/heirloom-api:${{ github.sha }}
  PUBLISH: ${{ github.event_name != 'pull_request' && vars.DOCKERHUB_USERNAME != '' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: heirloom
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci # throwaway database that only lives during this job
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 3s --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/heirloom

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ./api
          platforms: linux/amd64 # Azure runs amd64 machines
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.IMAGE }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && vars.DOCKERHUB_USERNAME != '' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Roll out the new image (creates a new revision)
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "$IMAGE" \
            --output none
      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            body=$(curl -fsS "${{ vars.API_URL }}/health" || true)
            echo "$body"
            echo "$body" | grep -q "${{ github.sha }}" && exit 0
            sleep 6
          done
          echo "::error::the new version did not answer on /health"
          exit 1
